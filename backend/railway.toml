# Railway config-as-code — applies when the service "Root Directory" is
# set to backend/ (Railway dashboard → service → Settings → Source).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /api/v1/health answers immediately; first-boot regulation ingestion runs
# in a background thread, so the healthcheck stays green while it completes.
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
